<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Você ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --rose:    #c96a5a;
    --rose-lt: rgba(220, 140, 120, 0.7);
    --cream:   rgba(255, 240, 232, 0.88);
    --muted:   rgba(255, 200, 180, 0.55);
    --bg:      #090507;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Cormorant Garamond', serif;
    color: var(--cream);
  }

  /* ── PARTICLES ── */
  #particles {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .p {
    position: absolute;
    border-radius: 50%;
    background: rgba(210, 120, 100, 0.25);
    animation: rise linear infinite;
  }

  @keyframes rise {
    0%   { transform: translateY(110vh) translateX(0) scale(0); opacity: 0; }
    8%   { opacity: 1; }
    92%  { opacity: 0.5; }
    100% { transform: translateY(-60px) translateX(var(--dx)) scale(1.2); opacity: 0; }
  }

  /* ── VIGNETTE ── */
  #vignette {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,0.72) 100%);
    pointer-events: none;
    z-index: 1;
  }

  /* ── MAIN SCENE ── */
  #scene-home {
    position: fixed; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: opacity 1.4s ease;
  }

  .heart {
    font-size: 52px;
    line-height: 1;
    margin-bottom: 36px;
    animation: heartbeat 2.4s ease-in-out infinite;
    filter: drop-shadow(0 0 18px rgba(200, 80, 70, 0.5));
    user-select: none;
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    30%       { transform: scale(1.12); }
    60%       { transform: scale(1.04); }
  }

  .eyebrow {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 13px;
    letter-spacing: 5px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 52px;
  }

  .btn {
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(255, 210, 195, 0.8);
    background: transparent;
    border: 1px solid rgba(200, 100, 85, 0.4);
    padding: 17px 52px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: color 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
  }

  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(180, 60, 50, 0.12);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.5s ease;
  }

  .btn:hover {
    color: #fff;
    border-color: rgba(210, 120, 100, 0.8);
    box-shadow: 0 0 36px rgba(180, 60, 50, 0.2);
  }

  .btn:hover::after { transform: scaleX(1); }

  .btn:disabled {
    opacity: 0.2;
    cursor: not-allowed;
    pointer-events: none;
  }

  /* ── CURTAIN ── */
  #curtain {
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.3s ease;
  }

  #curtain.show { opacity: 1; pointer-events: all; }

  /* ── LETTER SCENE ── */
  #scene-letter {
    position: fixed; inset: 0;
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px 80px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 2s ease;
    overflow-y: auto;
  }

  #scene-letter.show {
    opacity: 1;
    pointer-events: all;
  }

  .letter-wrap {
    max-width: 560px;
    width: 100%;
    text-align: center;
  }

  .greeting {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 16px;
    letter-spacing: 2px;
    color: var(--muted);
    opacity: 0;
    transition: opacity 1.2s ease;
    margin-bottom: 28px;
  }

  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    opacity: 0;
    transition: opacity 1s ease;
    margin-bottom: 28px;
  }

  .divider-line {
    display: block;
    width: 64px;
    height: 0.5px;
    background: rgba(200, 100, 85, 0.4);
  }

  .divider-dot {
    width: 4px; height: 4px;
    background: rgba(200, 100, 85, 0.6);
    border-radius: 50%;
  }

  .para {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: 19px;
    line-height: 2;
    color: var(--cream);
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 1.4s ease, transform 1.4s ease;
    margin-bottom: 30px;
  }

  .para.in {
    opacity: 1;
    transform: translateY(0);
  }

  .signature {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--rose-lt);
    opacity: 0;
    transition: opacity 1.6s ease;
    margin-top: 8px;
  }

  /* ── CLOSE BTN ── */
  #close-btn {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    background: transparent;
    border: none;
    color: rgba(255, 180, 160, 0.3);
    font-family: 'Playfair Display', serif;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: color 0.5s, opacity 0.8s;
    z-index: 60;
  }

  #close-btn.show { opacity: 1; pointer-events: all; }
  #close-btn:hover { color: rgba(255, 200, 180, 0.8); }

  /* ── HIDDEN YT ── */
  #yt { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div id="particles"></div>
<div id="vignette"></div>
<div id="curtain"></div>

<!-- HOME -->
<section id="scene-home">
  <span class="heart" aria-hidden="true">♡</span>
  <p class="eyebrow">para quem mora no meu peito</p>
  <button class="btn" id="btn-start" onclick="start()">Declarar Amor</button>
</section>

<!-- LETTER -->
<section id="scene-letter" aria-live="polite">
  <div class="letter-wrap">
    <p class="greeting" id="greeting">Para você, amor…</p>
    <div class="divider" id="div1">
      <span class="divider-line"></span>
      <span class="divider-dot"></span>
      <span class="divider-line"></span>
    </div>
    <div id="paras"></div>
    <div class="divider" id="div2">
      <span class="divider-line"></span>
      <span class="divider-dot"></span>
      <span class="divider-line"></span>
    </div>
    <p class="signature" id="sig">— Com todo o meu amor ♡</p>
  </div>
</section>

<button id="close-btn" onclick="close_scene()">Fechar</button>

<!-- YouTube invisible -->
<div id="yt"></div>

<script>
/* ── PARTICLES ── */
(function() {
  const c = document.getElementById('particles');
  for (let i = 0; i < 35; i++) {
    const d = document.createElement('div');
    d.className = 'p';
    const sz = 2 + Math.random() * 5;
    d.style.cssText = `
      left:${Math.random()*100}%;
      width:${sz}px; height:${sz}px;
      animation-duration:${9 + Math.random()*14}s;
      animation-delay:${Math.random()*14}s;
      --dx:${Math.random()*90-45}px;
    `;
    c.appendChild(d);
  }
})();

/* ── CARTA ── */
const TEXT = [
  "Existem coisas que a linguagem humana ainda não aprendeu a nomear, e você é uma delas. Uma sensação que vive entre o peito e a garganta — que aquece sem queimar, que pesa sem machucar.",
  "Cada vez que você sorri, o mundo parece respirar fundo. Como se até o tempo precisasse de um instante para admirar o que criou. E eu me pego pensando como fui sortudo de cruzar o seu caminho.",
  "Não foi a beleza que me conquistou primeiro. Foi aquela forma única que você tem de existir — delicada e intensa ao mesmo tempo, como a luz da tarde que entra pelas janelas e pinta tudo de dourado.",
  "Eu poderia tentar te explicar com versos, com músicas, com todas as metáforas que os poetas já inventaram. Mas nenhuma delas seria suficiente. Você é maior do que qualquer palavra que eu conheça.",
  "E então prefiro simplesmente dizer, sem floreios: eu te amo. Com a mesma certeza que tenho de que o sol vai nascer amanhã — e com a mesma leveza de quem finalmente encontrou onde pertence."
];

/* ── YOUTUBE ── */
let yt = null, ytReady = false;

window.onYouTubeIframeAPIReady = function() {
  yt = new YT.Player('yt', {
    videoId: 'LadRDA1BzmE',
    playerVars: { autoplay: 0, controls: 0, playsinline: 1 },
    events: { onReady: () => { ytReady = true; } }
  });
};

(function() {
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
})();

function play() {
  if (ytReady && yt) { try { yt.playVideo(); } catch(e) {} }
}

function stop() {
  if (ytReady && yt) { try { yt.stopVideo(); } catch(e) {} }
}

/* ── HELPERS ── */
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));

function reveal(el) { el.style.opacity = '1'; }

/* ── MAIN FLOW ── */
async function start() {
  $('btn-start').disabled = true;
  play();

  const curtain = $('curtain');
  curtain.classList.add('show');
  await wait(1300);

  const home = $('scene-home');
  home.style.opacity = '0';
  home.style.pointerEvents = 'none';

  const letter = $('scene-letter');
  letter.classList.add('show');

  curtain.style.transition = 'opacity 1.8s ease';
  curtain.classList.remove('show');
  await wait(1800);

  reveal($('greeting'));
  await wait(1100);
  reveal($('div1'));
  await wait(900);

  const container = $('paras');
  for (let i = 0; i < TEXT.length; i++) {
    const p = document.createElement('p');
    p.className = 'para';
    p.textContent = TEXT[i];
    container.appendChild(p);
    await wait(80);
    p.classList.add('in');
    await wait(2600);
  }

  reveal($('div2'));
  await wait(700);
  reveal($('sig'));
  await wait(900);

  const cb = $('close-btn');
  cb.classList.add('show');
}

async function close_scene() {
  const curtain = $('curtain');
  curtain.style.transition = 'opacity 0.9s ease';
  curtain.classList.add('show');
  await wait(1000);

  stop();

  $('scene-letter').classList.remove('show');
  $('close-btn').classList.remove('show');
  $('paras').innerHTML = '';

  ['greeting','div1','div2','sig'].forEach(id => {
    $(id).style.opacity = '0';
  });

  const home = $('scene-home');
  home.style.opacity = '1';
  home.style.pointerEvents = 'all';

  curtain.style.transition = 'opacity 1.2s ease';
  await wait(300);
  curtain.classList.remove('show');
  await wait(1300);
  $('btn-start').disabled = false;
}
</script>
</body>
</html>
